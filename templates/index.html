        // ============================================================

        async function requestMediaPermissions() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });

                logDebug('Media permissions granted');
                return true;

        // ============================================================
        // ENTER CLASSROOM (with improved presence and cleanup)
        // ============================================================
        async function enterClassroom() {
            logDebug('Entering classroom: ' + classCodeRoom + ' as ' + myUsername + (isTeacherUser ? ' (Teacher)' : ' (Student)'));
            // ... (UI hiding/showing, set labels, start local camera, register presence) ...

            // Register presence
            const presenceRef = db.ref('classrooms/' + classCodeRoom + '/presence/' + myUsername);
            presenceRef.set({
                username: myUsername,
                role: isTeacherUser ? 'instructor' : 'student',
                is_pro: isProUser,
                joined: Date.now()
            });
            presenceRef.onDisconnect().remove();

            // Listen for presence changes (new peers and removals)
            const presenceListRef = db.ref('classrooms/' + classCodeRoom + '/presence');
            presenceListRef.off();
            presenceListRef.on('child_added', (snap) => {
                const user = snap.val();
                const username = snap.key;
                if (username !== myUsername && !connectedPeers.has(username)) {
                    logDebug('New peer detected: ' + username);
                    const shouldInitiate = myUsername.localeCompare(username) < 0;
                    if (shouldInitiate) {
                        initiatePeerConnection(username, username, true);
                    } else {
                        logDebug('Waiting for ' + username + ' to initiate');
                    }
                    connectedPeers.add(username);
                }
            });

            // NEW: Listen for presence removal to clean up remote video
            presenceListRef.on('child_removed', (snap) => {
                const username = snap.key;
                if (username !== myUsername) {
                    logDebug('Peer removed: ' + username);
                    // Close peer connection
                    if (peerConnections[username]) {
                        peerConnections[username].close();
                        delete peerConnections[username];
                    }
                    connectedPeers.delete(username);
                    // Remove video card
                    const card = document.getElementById('peer-card-' + username);
                    if (card) card.remove();
                }
            });

            // Listen for messages (chat, emoji, camera status, etc.)
            const messagesRef = db.ref('classrooms/' + classCodeRoom + '/messages');
            messagesRef.off();
            messagesRef.on('child_added', (snapshot) => {
                const msg = snapshot.val();
                if (msg) handleIncomingMessage(msg);
            });

            // Listen for WebRTC signals (same as before)
            const signalsRef = db.ref('classrooms/' + classCodeRoom + '/signals/' + myUsername);
            signalsRef.off();
            signalsRef.on('child_added', (snapshot) => {
                const signal = snapshot.val();
                if (signal) {
                    logDebug('Received signal from ' + signal.from + ' type: ' + (signal.type || 'candidate'));
                    handleSignaling(signal);
                    snapshot.ref.remove();
                }
            });

            // ... rest of enterClassroom (teacher panel, etc.)
        }

        // ============================================================
        // HANDLE INCOMING MESSAGES (extended for camera status)
        // ============================================================
        function handleIncomingMessage(msg) {
            // ... (existing handling for emoji, global_mic_control, deploy_examination, exam_submission, publish_report_card, system) ...

            // NEW: Handle camera status updates from remote peers
            if (msg.type === 'camera_status') {
                const data = JSON.parse(msg.content);
                const username = msg.name; // sender's display name (without role)
                const overlay = document.getElementById('peer-blocked-overlay-' + username);
                if (overlay) {
                    if (data.cameraBlocked) {
                        overlay.classList.remove('hidden');
                    } else {
                        overlay.classList.add('hidden');
                    }
                }
                // Also update sound wave? No, sound wave is for audio.
                return;
            }

            // Default: append message (text or image)
            appendMsg(msg.name, msg.content, msg.type);
        }

        // ============================================================
        // LOCAL CAMERA TOGGLE (send camera_status update)
        // ============================================================
        document.getElementById('local-video-toggle').addEventListener('click', function() {
            cameraBlocked = !cameraBlocked;
            if (localStream && localStream.getVideoTracks().length > 0) {
                localStream.getVideoTracks().forEach(t => t.enabled = !cameraBlocked);
            }
            const overlay = document.getElementById('local-video-blocked');
            if (cameraBlocked) {
                this.innerText = "📷 Start Cam";
                this.classList.add('inactive');
                overlay.classList.remove('hidden');
            } else {
                this.innerText = "📷 Stop Cam";
                this.classList.remove('inactive');
                overlay.classList.add('hidden');
            }
            // Send camera status to all peers via Firebase messages
            const statusMsg = {
                name: myUsername,
                content: JSON.stringify({ cameraBlocked: cameraBlocked }),
                type: 'camera_status',
                timestamp: Date.now()
            };
            db.ref('classrooms/' + classCodeRoom + '/messages').push(statusMsg);
            logDebug('Camera status sent: ' + (cameraBlocked ? 'off' : 'on'));
        });

        // ============================================================
        // WEBRTC SIGNALING (initiatePeerConnection and handleSignaling)
        // ============================================================
        function initiatePeerConnection(targetId, name, isInitiator) {
            if (peerConnections[targetId]) {
                logDebug('PC already exists for ' + targetId + ', reusing');
                return peerConnections[targetId];
            }
            logDebug('Creating new PC for ' + targetId + ' (initiator: ' + isInitiator + ')');
            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections[targetId] = pc;
            pendingCandidates[targetId] = [];

            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                    logDebug('Added track to PC for ' + targetId + ': ' + track.kind);
                });
            }

            pc.onicecandidate = e => {
                if (e.candidate) {
                    const signal = { type: 'ice', candidate: e.candidate, from: myUsername };
                    db.ref('classrooms/' + classCodeRoom + '/signals/' + targetId).push(signal);
                    logDebug('Sent ICE candidate to ' + targetId);
                }
            };

            pc.oniceconnectionstatechange = () => {
                const state = pc.iceConnectionState;
                logDebug('ICE state for ' + targetId + ': ' + state);
                if (state === 'failed' || state === 'disconnected') {
                    logDebug('ICE failed/disconnected, restarting ICE');
                    pc.restartIce();
                }
                if (state === 'closed' || state === 'disconnected') {
                    delete peerConnections[targetId];
                    connectedPeers.delete(targetId);
                    const card = document.getElementById('peer-card-' + targetId);
                    if (card) card.remove();
                }
            };

            pc.ontrack = e => {
                logDebug('Track received from ' + targetId + ', kind: ' + e.track.kind);
                let card = document.getElementById('peer-card-' + targetId);
                let video;
                const remoteStream = (e.streams && e.streams[0]) ? e.streams[0] : new MediaStream([e.track]);

                if (!card) {
                    card = document.createElement('div');
                    card.className = 'video-card';
                    card.id = 'peer-card-' + targetId;
                    video = document.createElement('video');
                    video.autoplay = true;
                    video.playsInline = true;
                    video.muted = false;
                    video.volume = 1.0;
                    card.appendChild(video);

                    // Overlay for camera off
                    const overlay = document.createElement('div');
                    overlay.className = 'overlay hidden';
                    overlay.id = 'peer-blocked-overlay-' + targetId;
                    overlay.innerHTML = '<span>📷</span>Camera Off';
                    card.appendChild(overlay);

                    const label = document.createElement('div');
                    label.className = 'label';
                    label.innerText = name;
                    card.appendChild(label);

                    const wave = document.createElement('div');
                    wave.className = 'sound-wave';
                    wave.id = 'peer-wave-' + targetId;
                    wave.innerHTML = '<div class="bar"></div><div class="bar"></div><div class="bar"></div>';
                    card.appendChild(wave);

                    document.getElementById('video-layout-grid').appendChild(card);
                    logDebug('Created video card for ' + targetId);

                    // Click to expand (preserve)
                    card.addEventListener('click', function() {
                        const vid = this.querySelector('video');
                        const lbl = this.querySelector('.label');
                        const labelText = lbl ? lbl.innerText : name;
                        openVideoExpand(vid, labelText);
                        if (vid) {
                            vid.muted = false;
                            vid.volume = 1.0;
                            vid.play().catch(e => logDebug('Play on click error: ' + e.message));
                        }
                    });
                } else {
                    video = card.querySelector('video');
                }

                if (video) {
                    if (video.srcObject !== remoteStream) {
                        video.srcObject = remoteStream;
                    }
                    video.muted = false;
                    video.volume = 1.0;

                    // Attempt to play; if blocked, use a one-time click on document
                    const playVideo = () => {
                        video.play().catch(err => {
                            logDebug('Play error for ' + targetId + ': ' + err.message);
                        });
                    };

                    if (userHasInteracted) {
                        playVideo();
                    } else {
                        // Fallback: wait for any click on the page
                        const clickHandler = () => {
                            userHasInteracted = true;
                            playVideo();
                            document.removeEventListener('click', clickHandler);
                            // Remove hint if present
                            const hint = document.getElementById('click-hint');
                            if (hint) hint.remove();
                        };
                        document.addEventListener('click', clickHandler);
                        if (!document.getElementById('click-hint')) {
                            const hint = document.createElement('div');
                            hint.id = 'click-hint';
                            hint.style.position = 'fixed';
                            hint.style.bottom = '120px';
                            hint.style.left = '50%';
                            hint.style.transform = 'translateX(-50%)';
                            hint.style.background = 'rgba(0,0,0,0.7)';
                            hint.style.color = '#fff';
                            hint.style.padding = '10px 20px';
                            hint.style.borderRadius = '30px';
                            hint.style.fontSize = '14px';
                            hint.style.zIndex = '9999';
                            hint.innerText = '👆 Click anywhere to enable audio & video';
                            document.body.appendChild(hint);
                        }
                    }
                }
            };

            if (isInitiator) {
                pc.createOffer()
                    .then(o => pc.setLocalDescription(o))
                    .then(() => {
                        const signal = { type: 'offer', sdp: pc.localDescription, from: myUsername };
                        db.ref('classrooms/' + classCodeRoom + '/signals/' + targetId).push(signal);
                        logDebug('Sent offer to ' + targetId);
                    })
                    .catch(err => logDebug('Offer creation error: ' + err.message));
            }

            return pc;
        }

        async function handleSignaling(signal) {
            let pc = peerConnections[signal.from];
            if (!pc) {
                logDebug('Creating passive PC for ' + signal.from);
                pc = initiatePeerConnection(signal.from, signal.from, false);
                connectedPeers.add(signal.from);
            }

            if (signal.sdp) {
                try {
                    await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                    logDebug('Set remote description for ' + signal.from + ' type: ' + signal.sdp.type);
                    if (pendingCandidates[signal.from]) {
                        while (pendingCandidates[signal.from].length) {
                            const cand = pendingCandidates[signal.from].shift();
                            await pc.addIceCandidate(new RTCIceCandidate(cand)).catch(e => logDebug('Candidate add error: ' + e.message));
                        }
                    }
                    if (signal.sdp.type === 'offer') {
                        const ans = await pc.createAnswer();
                        await pc.setLocalDescription(ans);
                        const answerSignal = { type: 'answer', sdp: pc.localDescription, from: myUsername };
                        db.ref('classrooms/' + classCodeRoom + '/signals/' + signal.from).push(answerSignal);
                        logDebug('Sent answer to ' + signal.from);
                    }
                } catch (err) {
                    logDebug('Error handling SDP for ' + signal.from + ': ' + err.message);
                }
            } else if (signal.candidate) {
                if (pc.remoteDescription && pc.remoteDescription.type) {
                    await pc.addIceCandidate(new RTCIceCandidate(signal.candidate)).catch(e => logDebug('ICE add error: ' + e.message));
                } else {
                    if (!pendingCandidates[signal.from]) pendingCandidates[signal.from] = [];
                    pendingCandidates[signal.from].push(signal.candidate);
                    logDebug('Stored pending candidate from ' + signal.from);
                }
            }
        }
